<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karen Larissa Soares | Enfermeira oncológica e estomaterapeuta</title>
<meta name="description" content="Karen Larissa Soares, enfermeira oncológica, estomaterapeuta e especialista em laserterapia e fotobiomodulação. Atendimento domiciliar em Macaíba e Grande Natal, RN.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&family=Parisienne&display=swap">
<style data-keep>
:root{
  /* Layout: one-page editorial site. Arch-shaped photos, gold hairlines, soft rose blobs, olive bands. Brand palette taken from the professional's own posts. */
  --bg:#fbf4ef; --bg2:#f5e6dd; --surface:#fffaf6; --ink:#2b3526; --muted:#5b6654;
  --olive:#43523a; --olive-ink:#fbf4ef; --rose:#eecfc4; --rose-deep:#a65a4c;
  --gold:#a47a3a; --gold-soft:#d6b57a; --line:rgba(67,82,58,.18);
  --band:#3a4a2e; --band-ink:#f7ede6; --band-muted:#d3dcc6;
  --ok:#3d7637; --warn:#94651a; --bad:#a23b3b;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  --f-script:"Parisienne","Segoe Script","Brush Script MT",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a2016; --bg2:#212a1c; --surface:#273021; --ink:#f4ebe4; --muted:#c1cab8;
  --olive:#b2c897; --olive-ink:#1a2016; --rose:#4c332e; --rose-deep:#e6b4a6;
  --gold:#d9b673; --gold-soft:#8a7040; --line:rgba(244,235,228,.18);
  --band:#111710; --band-ink:#f4ebe4; --band-muted:#b9c3ae;
  --ok:#8fcb88; --warn:#e0b56a; --bad:#e58b8b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a2016; --bg2:#212a1c; --surface:#273021; --ink:#f4ebe4; --muted:#c1cab8;
  --olive:#b2c897; --olive-ink:#1a2016; --rose:#4c332e; --rose-deep:#e6b4a6;
  --gold:#d9b673; --gold-soft:#8a7040; --line:rgba(244,235,228,.18);
  --band:#111710; --band-ink:#f4ebe4; --band-muted:#b9c3ae;
  --ok:#8fcb88; --warn:#e0b56a; --bad:#e58b8b; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
ul{list-style:none;margin:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{scroll-margin-top:76px}
.sec{padding-block:clamp(56px,9vw,104px)}
.alt{background:var(--bg2)}
.eyebrow{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
.script{font-family:var(--f-script);color:var(--rose-deep);font-weight:400}
.h2{font-size:clamp(2rem,4.6vw,3.2rem)}
.lead{font-size:1.08rem;color:var(--muted);max-width:60ch}
.rule{height:1px;border:0;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:0}
.sec-head{display:grid;gap:12px;margin-bottom:clamp(28px,5vw,48px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.85rem 1.45rem;border-radius:999px;background:var(--olive);color:var(--olive-ink);font:500 .98rem/1.2 var(--f-body);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -12px rgba(0,0,0,.45)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:.55rem 1rem;font-size:.88rem}
.btn[aria-disabled="true"]{opacity:.55}
.btn svg{width:20px;height:20px;flex:none}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{width:38px;height:32px;flex:none}
.brand span{font:600 1.3rem/1 var(--f-display);white-space:nowrap}
.nav{display:flex;align-items:center;gap:22px}
.nav a{text-decoration:none;font-size:.92rem;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.menu-btn{display:none}
@media (max-width:860px){
  .menu-btn{display:inline-flex}
  .nav{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:0;padding:8px max(16px,env(safe-area-inset-left,0px)) 14px;display:none}
  .nav.open{display:flex}
  .nav a{padding:12px 0;border-bottom:1px solid var(--line);font-size:1rem}
  .nav .btn{margin-top:12px}
}
@media (max-width:420px){.brand span{font-size:1.1rem}}

/* hero */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(55% 60% at 92% 8%,color-mix(in srgb,var(--rose) 80%,transparent),transparent 70%),
  radial-gradient(40% 45% at 0% 100%,color-mix(in srgb,var(--rose) 55%,transparent),transparent 70%),var(--bg)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,64px);align-items:center;padding-block:clamp(40px,7vw,88px)}
.hero h1{font-size:clamp(2.9rem,8.4vw,5.6rem);font-weight:500;line-height:.98;margin:10px 0 18px}
.creds{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px;padding-top:16px;border-top:1px solid var(--gold-soft);max-width:30rem;margin-bottom:22px}
.hero .script{font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1.2}
.hero .lead{margin-bottom:26px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-size:.9rem;color:var(--muted)}
.facts li{display:flex;align-items:center;gap:8px}
.facts svg{width:18px;height:18px;color:var(--gold)}
.arch-wrap{position:relative;padding:0 16px 16px 0;max-width:460px;justify-self:center;width:100%}
.arch-wrap::before{content:"";position:absolute;top:16px;left:16px;right:0;bottom:0;border:1px solid var(--gold-soft);border-radius:999px 999px 30px 30px}
.arch{position:relative;border-radius:999px 999px 30px 30px;overflow:hidden;aspect-ratio:4/5;background:var(--rose);box-shadow:0 30px 50px -34px rgba(67,82,58,.55)}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:-10px;bottom:34px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;max-width:210px;font-size:.84rem;line-height:1.4;box-shadow:0 14px 28px -18px rgba(0,0,0,.4)}
.tag b{display:block;font:600 1.1rem/1.1 var(--f-display);margin-bottom:2px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.arch-wrap{max-width:360px}.tag{left:0}}

/* stats strip */
.stats{border-block:1px solid var(--line);background:var(--surface)}
.stats ul{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 56px;padding-block:22px}
.stats li{display:flex;align-items:baseline;gap:12px}
.stats b{font:600 2.2rem/1 var(--f-display);color:var(--olive);font-variant-numeric:tabular-nums}
.stats span{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* service cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .ic{width:46px;height:46px;border-radius:50%;background:var(--rose);color:var(--rose-deep);display:grid;place-items:center}
.card .ic svg{width:24px;height:24px}
.card h3{font-size:1.65rem}
.card .sub{font-family:var(--f-display);font-style:italic;font-size:1.15rem;color:var(--muted)}
.checks{display:grid;gap:10px}
.checks li{display:flex;gap:12px;align-items:flex-start}
.tick{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;background:var(--rose);color:var(--rose-deep);padding:4px}
.card .more{margin-top:auto;padding-top:6px}
.more a{font-size:.92rem;color:var(--olive);font-weight:500}

/* laser feature */
.feature{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(28px,5vw,64px);align-items:center}
@media (max-width:860px){.feature{grid-template-columns:1fr}}
.feature .arch-wrap{max-width:400px}
.feature h3{font-size:1.4rem;margin:26px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:.45rem .9rem;border:1px solid var(--gold-soft);border-radius:999px;font-size:.88rem;background:var(--surface)}
.note{font-size:.88rem;color:var(--muted);margin-top:18px;max-width:60ch}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:clamp(36px,6vw,64px)}
@media (max-width:980px){.tools{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.tools{grid-template-columns:1fr}}
.tool{border-top:2px solid var(--gold-soft);padding:16px 4px 0}
.tool h4{font-size:1.35rem;margin-bottom:6px}
.tool p{font-size:.92rem;color:var(--muted)}

/* home band */
.band{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold-soft) 60%,transparent);pointer-events:none}
.band .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);align-items:start;position:relative;z-index:1}
@media (max-width:860px){.band .wrap{grid-template-columns:1fr}}
.band .eyebrow{color:var(--band-muted)}
.band .script{color:var(--gold-soft);font-size:1.7rem}
.band .checks{margin-top:24px}
.band .tick{background:color-mix(in srgb,var(--band-ink) 14%,transparent);color:var(--gold-soft)}
.area{border:1px solid color-mix(in srgb,var(--band-ink) 28%,transparent);border-radius:22px;padding:26px;background:color-mix(in srgb,var(--band-ink) 6%,transparent)}
.area h3{font-size:1.6rem;margin-bottom:6px}
.area p{color:var(--band-muted);font-size:.95rem}
.area .chips{margin:18px 0}
.area .chips li{background:transparent;border-color:color-mix(in srgb,var(--band-ink) 35%,transparent);color:var(--band-ink)}
.band .btn{background:var(--band-ink);color:var(--band)}

/* testimonials */
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 26px 22px;display:grid;gap:14px;margin:0;align-content:start}
.quote::before{content:"\201C";font:400 4rem/.6 var(--f-display);color:var(--gold)}
.quote blockquote{margin:0;font:italic 500 1.28rem/1.4 var(--f-display)}
.quote figcaption{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{border:1px dashed var(--gold-soft);border-radius:22px;padding:34px;text-align:center;display:grid;gap:14px;justify-items:center;background:var(--surface)}
.empty .script{font-size:1.9rem}
.empty p{color:var(--muted);max-width:46ch}

/* forms */
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,64px);align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.steps{display:grid;gap:18px;margin-top:26px;counter-reset:s}
.steps li{display:flex;gap:16px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:600 1.1rem/1 var(--f-display)}
.steps b{display:block;font-weight:500}
.steps span{font-size:.92rem;color:var(--muted)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,32px);display:grid;gap:16px;box-shadow:0 26px 44px -34px rgba(67,82,58,.5)}
.fld{display:grid;gap:6px;font-size:.88rem;font-weight:500;min-width:0}
.fld input,.fld select,.fld textarea,.ad input[type=text],.ad input[type=number],.ad input[type=tel],.ad input[type=password],.ad select,.ad textarea{width:100%;font:400 1rem/1.4 var(--f-body);padding:.75rem .9rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fld textarea,.ad textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.preview{font-size:.88rem;color:var(--muted);background:var(--bg2);border-radius:14px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.preview b{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px;color:var(--ink)}
.hint{font-size:.85rem;color:var(--bad)}
.sug{max-width:760px;margin:0 auto}

/* footer */
.foot{background:var(--band);color:var(--band-ink);padding-block:clamp(48px,8vw,80px) 28px}
.foot .big{font-size:clamp(2.2rem,5vw,3.2rem);color:var(--gold-soft);margin-bottom:6px}
.foot .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:start}
@media (max-width:760px){.foot .grid{grid-template-columns:1fr}}
.contact{display:grid;gap:12px}
.contact a.line,.contact .line{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--band-ink) 28%,transparent);border-radius:16px;text-decoration:none;min-width:0}
.line svg{width:24px;height:24px;flex:none;color:var(--gold-soft)}
.line small{display:block;color:var(--band-muted);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.line span{overflow-wrap:anywhere}
.legal{margin-top:36px;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--band-ink) 22%,transparent);font-size:.8rem;color:var(--band-muted);display:grid;gap:8px}
.legal button{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0;justify-self:start}
.float{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:56px;height:56px;border-radius:50%;background:var(--olive);color:var(--olive-ink);display:grid;place-items:center;box-shadow:0 14px 28px -10px rgba(0,0,0,.5)}
.float svg{width:28px;height:28px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:999px;font-size:.9rem;z-index:90;max-width:calc(100% - 32px);text-align:center}

/* admin */
.ad{position:fixed;inset:0;z-index:70;overflow:auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ad-in{max-width:880px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.ad-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.ad-bar h2{font-size:1.6rem}
.ad-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.ad-tabs button{flex:none;border:1px solid transparent;background:none;color:var(--muted);padding:.55rem 1rem;border-radius:999px;font:500 .92rem var(--f-body);cursor:pointer}
.ad-tabs button[aria-selected="true"]{background:var(--olive);color:var(--olive-ink)}
.ad-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px;margin-bottom:18px}
.ad-card h3{font-size:1.45rem}
.ad-card label,.ad-login label{display:grid;gap:6px;font-size:.88rem;font-weight:500}
.ad-card .chk,.ad-login .chk{display:flex;align-items:center;gap:10px}
.ad-card .chk input{width:auto}
.ad .hint2{font-size:.85rem;color:var(--muted)}
.ad-counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.ad-counts div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ad-counts b{display:block;font:600 2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.ad-counts span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;margin-bottom:12px;min-width:0}
.item header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.item b{font-weight:600}
.item p{font-size:.92rem;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.pill{--c:var(--muted);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .65rem;border-radius:999px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.pill.pendente,.pill.nova{--c:var(--warn)}
.pill.confirmado,.pill.lida{--c:var(--ok)}
.pill.cancelado{--c:var(--bad)}
.notice{border:1px solid var(--warn);color:var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}
.ad-login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.ad-login form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:30px;display:grid;gap:16px;text-align:center}
.ad-login label{text-align:left}
.ad-login .err{color:var(--bad);font-size:.9rem}
.link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

      <div>
        <p class="eyebrow">Fotobiomodulação</p>
        <h2 class="h2" style="margin:10px 0 14px">Luz que apoia a recuperação</h2>
        <p class="lead">A laserterapia de baixa intensidade usa luz em comprimentos de onda específicos para estimular os tecidos. Indicação, dose e número de sessões são definidos depois de uma avaliação individual.</p>
        <h3>Indicações</h3>
        <ul class="checks">
          <li><svg class="tick" aria-hidden="true"><use href="#i-check"/></svg>Alívio da dor, aguda e crônica</li>
          <li><svg class="tick" aria-hidden="true"><use href="#i-check"/></svg>Mucosite oral</li>
          <li><svg class="tick" aria-hidden="true"><use href="#i-check"/></svg>Cicatrização de feridas e lesões</li>
          <li><svg class="tick" aria-hidden="true"><use href="#i-check"/></svg>Dermatites, como a radiodermite</li>
          <li><svg class="tick" aria-hidden="true"><use href="#i-check"/></svg>Prevenção e tratamento de lesão por pressão</li>
          <li><svg class="tick" aria-hidden="true"><use href="#i-check"/></svg>Suporte em condições respiratórias, como rinite, sinusite e tosse</li>
        </ul>
        <h3>Benefícios</h3>
        <ul class="chips">
          <li>Reduz dor e inflamação</li><li>Acelera a cicatrização</li><li>Estimula a regeneração tecidual</li>
          <li>Melhora o conforto e a qualidade de vida</li><li>Pode diminuir o uso de analgésicos</li><li>Suporte em condições respiratórias</li>
        </ul>
      </div>
    </div>
    <div class="tools">
      <div class="tool"><h4>Terapia com LED</h4><p>Luz de baixa intensidade que complementa o laser na modulação da inflamação e na regeneração dos tecidos.</p></div>
      <div class="tool"><h4>ILIB</h4><p>Irradiação intravascular de luz, indicada e conduzida somente após avaliação individual.</p></div>
      <div class="tool"><h4>PDT</h4><p>Fototerapia dinâmica: luz associada a substâncias fotossensibilizantes, para lesões, feridas e cuidados com a pele.</p></div>
      <div class="tool"><h4>Protocolos personalizados</h4><p>Cada tratamento é planejado de acordo com a sua necessidade, com foco em segurança e eficácia.</p></div>
    </div>
  </div>

    '<select id="st-'+esc(x.id)+'" data-st="'+esc(x.id)+'" aria-label="Situação">'+ST.map(function(s){return '<option'+(s===x.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
    '<button class="btn ghost sm" data-act="ag-edit" data-id="'+esc(x.id)+'">Editar</button><button class="btn danger sm" data-act="ag-del" data-id="'+esc(x.id)+'">'+(A.delArm==='a'+x.id?'Toque de novo para excluir':'Excluir')+'</button></div></article>'}).join(''):'<p class="hint2">Nenhum agendamento registrado.</p>';
  if(A.tab==='recados')l.innerHTML=A.rc.length?A.rc.map(function(x){return '<article class="item"><header><b>'+esc(x.nome||'Sem nome')+' <span class="hint2">('+esc(x.tipo)+', '+fmtDate(x.criado)+')</span></b><span class="pill '+(x.lida?'lida':'nova')+'">'+(x.lida?'lida':'nova')+'</span></header>'+
    '<p>'+esc(x.texto)+(x.contato?'\nContato: '+esc(x.contato):'')+'</p><div class="row"><button class="btn ghost sm" data-act="rc-read" data-id="'+esc(x.id)+'">'+(x.lida?'Marcar como nova':'Marcar como lida')+'</button>'+
    '<button class="btn ghost sm" data-act="rc-edit" data-id="'+esc(x.id)+'">Editar</button><button class="btn danger sm" data-act="rc-del" data-id="'+esc(x.id)+'">'+(A.delArm==='r'+x.id?'Toque de novo para excluir':'Excluir')+'</button></div></article>'}).join(''):'<p class="hint2">Nenhuma mensagem registrada.</p>'}
function onInput(e){var t=e.target;
  if(t.dataset.st){if(A.db)A.db.doc('agendamentos/'+t.dataset.st).update({status:t.value}).catch(function(){toast('Não foi possível atualizar.')});return}
  if(t.dataset.f){var k=t.dataset.f;if(t.type==='checkbox')A.draft[k]=t.checked;else if(t.type==='number')A.draft[k]=Math.max(0,parseInt(t.value||'0',10)||0);
    else if(k==='cidades')A.draft.cidades=t.value.split(',').map(function(s){return s.trim()}).filter(Boolean);
    else if(k==='whatsapp')A.draft.whatsapp=digits(t.value);
    else if(k==='instagram')A.draft.instagram=t.value.trim().replace(/^.*instagram\.com\//i,'').replace(/^@/,'').replace(/[@\/?].*$/,'');
    else A.draft[k]=t.value;return}
  if(t.dataset.dep!==undefined){var d=A.draft.depoimentos[+t.dataset.dep];if(d)d[t.dataset.k]=t.type==='checkbox'?t.checked:t.value}}
function onClick(e){var b=e.target.closest('[data-act],[data-tab]');if(!b)return;
  if(b.dataset.tab){A.tab=b.dataset.tab;A.delArm=null;tabView();return}
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='close')closeAdmin();
  else if(a==='logout'){A.logged=false;try{sessionStorage.setItem('ks-adm','0')}catch(x){}closeAdmin()}
  else if(a==='save')savePublic(b);
  else if(a==='dep-add'){A.draft.depoimentos.push({nome:'',texto:'',publicado:true});tabView()}
  else if(a==='dep-del'){var k='d'+b.dataset.i;if(A.delArm===k){A.draft.depoimentos.splice(+b.dataset.i,1);A.delArm=null}else A.delArm=k;tabView()}
  else if(a==='ag-edit'){A.editAg=id;tabView()}else if(a==='ag-cancel'){A.editAg=null;tabView()}
  else if(a==='rc-edit'){A.editRc=id;tabView()}else if(a==='rc-cancel'){A.editRc=null;tabView()}
  else if(a==='ag-del'||a==='rc-del'){var key=(a==='ag-del'?'a':'r')+id;if(A.delArm===key){A.delArm=null;if(A.db)A.db.doc((a==='ag-del'?'agendamentos/':'recados/')+id).delete().catch(function(){toast('Não foi possível excluir.')})}else{A.delArm=key;fillLists()}}
  else if(a==='rc-read'){var r=A.rc.filter(function(x){return x.id===id})[0];if(r&&A.db)A.db.doc('recados/'+id).update({lida:!r.lida}).catch(function(){toast('Não foi possível atualizar.')})}}
function saveAg(){if(!A.db)return toast('Registro privado indisponível neste acesso.');var nome=g('ag-n');if(!nome)return toast('Informe o nome.');
  var v={nome:nome,contato:g('ag-c'),servico:g('ag-s'),quando:g('ag-q'),local:g('ag-l'),status:g('ag-st')||'pendente',obs:g('ag-o')};
  var p=A.editAg?A.db.doc('agendamentos/'+A.editAg).update(v):A.db.collection('agendamentos').add(Object.assign(v,{criado:Date.now()}));
  p.then(function(){A.editAg=null;toast('Agendamento salvo.');tabView()},function(){toast('Não foi possível salvar.')})}
function saveRc(){if(!A.db)return toast('Registro privado indisponível neste acesso.');var tx=g('rc-x');if(!tx)return toast('Escreva o texto da mensagem.');
  var v={tipo:g('rc-t'),nome:g('rc-n'),contato:g('rc-c'),texto:tx,lida:$('#rc-l').checked};
  var p=A.editRc?A.db.doc('recados/'+A.editRc).update(v):A.db.collection('recados').add(Object.assign(v,{criado:Date.now()}));
  p.then(function(){A.editRc=null;toast('Mensagem salva.');tabView()},function(){toast('Não foi possível salvar.')})}
function buildDoc(next){
  var parts=$$('[data-keep]').map(function(el){return el.id==='root'?'<div id="root"></div>':el.id==='toast'?'<div id="toast" hidden role="status"></div>':el.id==='site-data'?'<script type="application/json" id="site-data" data-keep>'+JSON.stringify(next).replace(/</g,'\\u003c')+'<'+'/script>':el.outerHTML});
  return SKEL+'\n'+parts.join('\n')+'</body></html>'}
function savePublic(btn){if(!A.canEdit)return toast('Esta conta não pode publicar mudanças no site.');
  var next=JSON.parse(JSON.stringify(A.draft));next.depoimentos=next.depoimentos.filter(function(d){return (d.nome||'').trim()||(d.texto||'').trim()});
  if(!digits(next.whatsapp))return toast('Informe o número do WhatsApp.');if(!next.instagram)return toast('Informe o usuário do Instagram.');
  btn.disabled=true;var old=btn.textContent;btn.textContent='Salvando…';
  use('artifact').then(function(art){if(!art)throw {code:'unavailable'};return art.publish(buildDoc(next))}).then(function(){toast('Publicado. Atualizando a página…')},function(er){
    btn.disabled=false;btn.textContent=old;var c=er&&er.code;toast(c==='conflict'?'Outra alteração foi publicada antes. A página vai recarregar.':(c==='not_writer'||c==='not_granted')?'Esta conta não pode publicar mudanças no site.':'Não foi possível salvar. Tente de novo.')})}

mount();
try{if(sessionStorage.getItem('ks-adm')==='1')A.logged=true;if(sessionStorage.getItem('ks-open')==='1'||location.hash==='#admin')openAdmin()}catch(e){if(location.hash==='#admin')openAdmin()}
})();
</script>
